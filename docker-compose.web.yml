services:
  cc-haha-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3456:3456"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3456
      - CC_HAHA_WEB_MODE=1
      - CC_HAHA_WEB_AUTH=1
      - CC_HAHA_DATA_DIR=/data
    volumes:
      - ./data:/data
      - ./workspace:/workspace
